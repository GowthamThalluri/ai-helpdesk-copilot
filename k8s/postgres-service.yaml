apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: helpdesk
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: helpdesk
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
# Important fields:
# - clusterIP: None creates a headless Service.
# - selector identifies the Pods it should associate with.
# - port is the Service's port.
# - targetPort is the named container port to which traffic is directed.


# Important fields:
# - type: ClusterIP creates an internal cluster Service.
# - name: postgres gives FastAPI its database hostname.
# - Both Services use app: postgres, which we'll put on the PostgreSQL Pod later.
# - targetPort: postgres will match the named port in our PostgreSQL container.