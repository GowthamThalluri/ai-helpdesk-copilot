# AI Helpdesk - Production Environment

image:
  repository: ai-helpdesk-copilot
  tag: "1.3"
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 80

envFrom:
  - configMapRef:
      name: helpdesk-config-prod
  - secretRef:
      name: helpdesk-db-secret-prod

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70